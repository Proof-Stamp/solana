name: History secret scan

on:
  push:
    branches: [chore/public-release-hardening]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan reachable main history without printing candidate values
        shell: python
        run: |
          import re
          import subprocess
          import sys

          commits = subprocess.check_output(
              ['git', 'rev-list', 'origin/main'], text=True
          ).splitlines()

          assignment_re = re.compile(
              r'(?i)(SOLANA_FEE_PAYER_SECRET|CLOUDFLARE_API_TOKEN|RATE_LIMIT_SALT)\s*[:=]\s*([^\r\n]+)'
          )
          byte_array_re = re.compile(r'\[(?:\s*\d{1,3}\s*,){31,63}\s*\d{1,3}\s*\]')
          long_base58_re = re.compile(r'(?<![1-9A-HJ-NP-Za-km-z])[1-9A-HJ-NP-Za-km-z]{80,100}(?![1-9A-HJ-NP-Za-km-z])')
          long_base64_re = re.compile(r'(?<![A-Za-z0-9+/])[A-Za-z0-9+/]{40,}={0,2}(?![A-Za-z0-9+/=])')
          private_key_re = re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')
          credential_url_re = re.compile(r'https://[^\s/:]+:[^\s/@]+@|[?&](?:api[_-]?key|token)=[^\s&]+', re.I)

          safe_markers = (
              'replace-with', 'placeholder', 'example', '<secret>', '<32-', '<64-',
              '<your-', '[64-byte', '[32-byte', 'not configured', 'base64secret32()',
              'process.env.', 'env.', '${{',
          )

          def is_explicit_placeholder(raw_value):
              value = raw_value.strip().strip('"\'').strip()
              lower = value.lower()
              if any(marker in lower for marker in safe_markers):
                  return True
              # Documentation consistently uses angle-bracket placeholders such as
              # <secret> and <your-pages-or-custom-domain>. Treat those as examples.
              if value.startswith('<') and value.endswith('>'):
                  return True
              return False

          findings = []
          seen = set()
          for commit in commits:
              paths = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', commit], text=True
              ).splitlines()
              for path in paths:
                  if path.startswith('node_modules/') or path.endswith(('.png', '.jpg', '.jpeg', '.gif', '.ico', '.woff', '.woff2')):
                      continue
                  try:
                      blob = subprocess.check_output(
                          ['git', 'show', f'{commit}:{path}'], stderr=subprocess.DEVNULL
                      )
                      text = blob.decode('utf-8')
                  except (subprocess.CalledProcessError, UnicodeDecodeError):
                      continue

                  for match in assignment_re.finditer(text):
                      if is_explicit_placeholder(match.group(2)):
                          continue
                      key = (commit, path, f'non-placeholder {match.group(1)} assignment')
                      if key not in seen:
                          seen.add(key)
                          findings.append(key)

                  checks = (
                      ('possible raw byte-array secret', byte_array_re),
                      ('possible long Base58 secret', long_base58_re),
                      ('possible long Base64 secret', long_base64_re),
                      ('private-key PEM marker', private_key_re),
                      ('credential-bearing URL', credential_url_re),
                  )
                  for label, pattern in checks:
                      for match in pattern.finditer(text):
                          candidate = match.group(0)
                          if is_explicit_placeholder(candidate):
                              continue
                          # Long Base64-like strings frequently occur in lockfiles and
                          # generated integrity metadata. Assignment checks cover our
                          # sensitive variable names; skip package metadata here.
                          if label == 'possible long Base64 secret' and path.endswith(('package-lock.json', 'npm-shrinkwrap.json')):
                              continue
                          key = (commit, path, label)
                          if key not in seen:
                              seen.add(key)
                              findings.append(key)

          if findings:
              print('Potential secret-like history entries found. Values are intentionally not printed.')
              for commit, path, label in findings:
                  print(f'{commit[:12]} {path}: {label}')
              sys.exit(1)

          print(f'No obvious secret literals found across {len(commits)} reachable origin/main commits.')
