name: Public-release history secret scan

on:
  push:
    branches: [release/public-readiness-2026-09-14]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch branches, tags, and pull-request heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force origin '+refs/tags/*:refs/tags/*' || true
          git fetch --force origin '+refs/pull/*/head:refs/remotes/pull/*' || true
      - name: Scan all reachable history without printing candidate values
        shell: python
        run: |
          import re
          import subprocess
          import sys

          def git(*args, text=True):
              return subprocess.check_output(['git', *args], text=text, stderr=subprocess.DEVNULL)

          commits = git('rev-list', '--all').splitlines()
          refs = git('for-each-ref', '--format=%(refname)', 'refs/heads', 'refs/remotes', 'refs/tags').splitlines()

          # High-signal assignments for secrets used by this project plus common credential names.
          assignment_re = re.compile(
              r'(?i)\b('
              r'SOLANA_FEE_PAYER_SECRET|CLOUDFLARE_API_TOKEN|CF_API_TOKEN|RATE_LIMIT_SALT|'
              r'PRIVATE_KEY|SECRET_KEY|API_KEY|API_TOKEN|ACCESS_TOKEN|AUTH_TOKEN'
              r')\b\s*[:=]\s*([^\r\n]+)'
          )
          byte_array_re = re.compile(r'\[(?:\s*\d{1,3}\s*,){31,63}\s*\d{1,3}\s*\]')
          long_base58_re = re.compile(r'(?<![1-9A-HJ-NP-Za-km-z])[1-9A-HJ-NP-Za-km-z]{80,100}(?![1-9A-HJ-NP-Za-km-z])')
          private_key_re = re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')
          credential_url_re = re.compile(r'https://[^\s/:]+:[^\s/@]+@|[?&](?:api[_-]?key|token|access[_-]?token)=[^\s&]+', re.I)
          github_token_re = re.compile(r'\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b')
          aws_access_key_re = re.compile(r'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b')
          bearer_re = re.compile(r'(?i)\b(?:authorization\s*:\s*bearer|bearer)\s+[A-Za-z0-9._~+/=-]{20,}')
          jwt_re = re.compile(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b')

          safe_markers = (
              'replace-with', 'placeholder', 'example', '<secret>', '<32-', '<64-',
              '<your-', '[64-byte', '[32-byte', 'not configured', 'base64secret32()',
              'process.env.', 'env.', 'dummy', 'test-only', 'test_only',
          )

          suspicious_path_re = re.compile(
              r'(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(?:pem|p12|pfx|key)$)', re.I
          )

          skip_suffixes = (
              '.png', '.jpg', '.jpeg', '.gif', '.ico', '.webp', '.woff', '.woff2',
              '.pdf', '.zip', '.gz', '.tar', '.lockb'
          )

          def is_explicit_placeholder(raw_value):
              value = raw_value.strip().strip("\"'").strip()
              lower = value.lower()
              if any(marker in lower for marker in safe_markers):
                  return True
              if value.startswith('<') and value.endswith('>'):
                  return True
              return False

          findings = []
          seen = set()

          def add(commit, path, label):
              key = (commit, path, label)
              if key not in seen:
                  seen.add(key)
                  findings.append(key)

          checks = (
              ('possible raw Solana/key byte-array secret', byte_array_re),
              ('possible long Base58 secret', long_base58_re),
              ('private-key PEM marker', private_key_re),
              ('credential-bearing URL', credential_url_re),
              ('GitHub token literal', github_token_re),
              ('AWS access-key literal', aws_access_key_re),
              ('literal bearer credential', bearer_re),
              ('JWT-like credential', jwt_re),
          )

          for commit in commits:
              # Commit messages are public history too.
              try:
                  message = git('show', '-s', '--format=%B', commit)
              except subprocess.CalledProcessError:
                  message = ''
              for label, pattern in checks:
                  for match in pattern.finditer(message):
                      if not is_explicit_placeholder(match.group(0)):
                          add(commit, '<commit-message>', label)

              paths = git('ls-tree', '-r', '--name-only', commit).splitlines()
              for path in paths:
                  if path.startswith('node_modules/') or path.endswith(skip_suffixes):
                      continue
                  if suspicious_path_re.search(path) and not path.endswith(('.env.example', '.dev.vars.example')):
                      add(commit, path, 'sensitive-looking filename committed')

                  try:
                      blob = git('show', f'{commit}:{path}', text=False)
                      text = blob.decode('utf-8')
                  except (subprocess.CalledProcessError, UnicodeDecodeError):
                      continue

                  for match in assignment_re.finditer(text):
                      if is_explicit_placeholder(match.group(2)):
                          continue
                      add(commit, path, f'non-placeholder {match.group(1)} assignment')

                  for label, pattern in checks:
                      for match in pattern.finditer(text):
                          candidate = match.group(0)
                          if is_explicit_placeholder(candidate):
                              continue
                          # npm integrity hashes and similar metadata are not credentials.
                          if path.endswith(('package-lock.json', 'npm-shrinkwrap.json')) and label in (
                              'possible long Base58 secret', 'literal bearer credential', 'JWT-like credential'
                          ):
                              continue
                          add(commit, path, label)

          if findings:
              print('Potential secret-like history entries found. Candidate values are intentionally not printed.')
              for commit, path, label in findings:
                  print(f'{commit[:12]} {path}: {label}')
              print(f'Scanned {len(commits)} unique reachable commits from {len(refs)} fetched refs.')
              sys.exit(1)

          print(f'No obvious secret literals found across {len(commits)} unique reachable commits from {len(refs)} fetched refs.')
