name: Generate lockfile

on:
  push:
    branches: [chore/public-release-hardening]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/public-release-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --global npm@12.0.2
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:chore/public-release-hardening
