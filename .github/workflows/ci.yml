name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node --check worker/index.mjs
      - run: node --check functions/api/stamps.mjs
      - run: node -e "import('./worker/index.mjs').then(() => console.log('worker imports ok'))"
      - run: node -e "import('./functions/api/stamps.mjs').then(() => console.log('Pages function imports ok'))"
